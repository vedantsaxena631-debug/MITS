version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: mits_mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
    volumes:
      - mongodb_data:/data/db
    networks:
      - mits_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mits_backend
    ports:
      - "5000:5000"
    environment:
      MONGODB_URI: mongodb://admin:password123@mongodb:27017/mits_college
      JWT_SECRET: your_jwt_secret_key
      NODE_ENV: production
    depends_on:
      - mongodb
    networks:
      - mits_network
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mits_frontend
    ports:
      - "3000:3000"
    environment:
      REACT_APP_API_URL: http://localhost:5000/api
    depends_on:
      - backend
    networks:
      - mits_network
    volumes:
      - ./frontend:/app

volumes:
  mongodb_data:

networks:
  mits_network:
    driver: bridge
