services:
  # Backend Web Service
  - type: web
    name: mits-hub-backend
    env: node
    plan: free
    region: ohio
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        fromService:
          type: web
          name: mits-hub-frontend
          property: url

  # Frontend Static Site
  - type: web
    name: mits-hub-frontend
    env: static
    plan: free
    region: ohio
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishDir: build
    envVars:
      - key: REACT_APP_API_URL
        fromService:
          type: web
          name: mits-hub-backend
          property: url
        suffix: /api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
