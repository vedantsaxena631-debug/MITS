# Render Configuration - Single Service Deployment

services:
  - type: web
    name: mits-hub
    env: node
    plan: free
    buildCommand: cd backend && npm install && cd ../frontend && npm install --legacy-peer-deps && npm run build
    startCommand: node backend/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false # Set this in Render Dashboard
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRE
        value: 7d
